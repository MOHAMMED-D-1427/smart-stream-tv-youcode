<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/output.css">
    <link rel="shortcut icon" href="assets/icon.png" type="image/x-icon">
    <script src="https://kit.fontawesome.com/a034b0a078.js" crossorigin="anonymous"></script>

    <script type="module" src="./js/app.js" defer></script>

    <title>Smart Stream TV</title>
</head>
<body class="bg-black text-gray-300 relative">
    <span id="http-error" class="hidden items-center gap-1.5 font-bold  fixed z-20 top-0 right-0 m-3 text-[#ff0000f5] bg-[#3700ff24] py-1 px-2 border-2 border-primary rounded">
        </span>
        
            <!--        display: flex;
    align-items: center;
    gap: 5px; -->
    <header class="w-11/12 mx-auto mt-2.5">
        <!-- <p class="text-primary font-bold">Smart Stream TV</p> -->
         <img src="assets/Smart Stream TV Logo.png" alt="Website logo" class="w-37.5">

    </header>

    <main class="my-10">
        
        <!-- ==================== Channels & TV Player -->
        <div class="flex justify-center gap-5 ">
            <!-- ==> Active: bg-linear-to-r from-15%-black to-primary -->
            <div class="text-sm bg-gray-950 w-fit px-4 pb-7 relative rounded h-screen overflow-y-scroll scrollbar-thumb-primary scrollbar-thin">

                <div class="s-f-container sticky top-0 z-10 pt-2.5 bg-gray-950">
                    <!-- ==================== Search -->
                    <div class="border-2 border-secondary flex items-center w-full rounded px-2 py-0.5 my-3.5 mx-auto">
                        <input id="search" placeholder="Search a channel" class="border-0 outline-none text-gray-400 w-full p-1">
                        <i class="fas fa-search text-secondary text-[20px]"></i>

                    </div>
                    <!-- ==================== Filter -->
    
                    <select class="w-92.5 mb-3 p-1.5 rounded bg-black text-white outline-none" id="categories">
                        <option value="">All categories</option>
                        <option value="DOCUMENTARY">DOCUMENTARY</option>
                        <option value="RELIGION">RELIGION</option>
                        <option value="NEWS">NEWS</option>
                        <option value="CULTURE">CULTURE</option>
                        <option value="KIDS">KIDS</option>
                        <option value="ENTERTAINMENT">ENTERTAINMENT</option>
                        <option value="CINEMA">CINEMA</option>
                        <option value="SPORT">SPORT</option>
                    </select>
                </div>

                <table class="w-92.5 border border-gray-900 " >
                    <tbody id="channels">
                        <tr class="border-b border-gray-900 px-1 chan-hover">
                            <td>&nbsp; 1127</td><td><img src="https://placehold.co/60x60.png?text=Mumbai" alt="Channel Logo" class="w-12.75"></td><td>IN - MUMBAI NEWS HD</td>
                        </tr>
                    </tbody>
                </table>
               
            </div>
            <!-- =================================== Channel Info ================ -->
            <div class="bg-gray-950 px-4 py-7 rounded w-112.5 h-fit">
                <p class="text-2xl font-bold text-center mb-3">Channel Player <i class="fas fa-play-circle"></i></p>
                <div id="player" class="mx-auto border-2 border-gray-900 w-100 h-70 flex justify-center items-center">
                    <span id="empty-player"><i class="fas fa-video-slash"></i> No Channel is live</span>
                    <video class="hidden border border-primary rounded  w-100 h-full" controls src="" ></video>
                </div>


                <hr class="text-gray-900 my-9">

                <div id="chan-info">
                    <p class="text-[20px] font-bold pb-2.5">Channel Info</p>

                    <div class="border border-secondary rounded">

                        <table class="w-full">
                            <tbody>
                                <tr>
                                    <td class="p-2">Name</td><td id="name" class="text-gray-700">XXXXXXXXXXXX</td>
                                </tr>
                                <tr>
                                    <td class="p-2">Program</td><td id="program" class="text-gray-700">XXXXXXXXXXXX</td>
                                </tr>
                                <tr>
                                    <td class="p-2">Number</td><td id="number" class="text-gray-700">XXXXXXXXXXXX</td>
                                </tr>
                                <tr>
                                    <td class="p-2">Country</td><td id="country" class="text-gray-700">XXXXXXXXXXXX</td>
                                </tr>
                                <tr>
                                    <td class="p-2">Start time</td><td id="s-time" class="text-gray-700">XXXXXXXXXXXX</td>
                                </tr>
                                <tr>
                                    <td class="p-2">Start end</td><td id="e-time" class="text-gray-700">XXXXXXXXXXXX</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>
        </div>
    </main>
</body>
</html>
